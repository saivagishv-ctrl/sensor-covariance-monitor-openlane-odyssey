---
project:
  title:        "Sensor Covariance Anomaly Detector"
  author:       "OpenLane Odyssey"
  discord:      "saithescienceguy"
  description:  "Calibrates a per-channel mean and variance profile from an 8-channel sensor's baseline readings, then flags new readings that deviate too far from that profile."
  language:     "Verilog"
  clock_hz:     40000000

  # 1x2: verified via local OpenLane run -- 1x1 fails Global Placement at
  # 186% utilization (std-cell area 24,189 sq um vs a single tile's usable
  # core), 1x2 passes cleanly (DRC/LVS/antenna all pass, zero timing
  # violations) at 87% target density.
  tiles: "1x2"

  source_files:
    - "sensor_monitor.sv"
    - "tt_um_sensor_monitor.sv"
  top_module:  "tt_um_sensor_monitor"

pinout:
  # Shared data-byte input: carries a calibration byte while calib_ld_en
  # (uio_in[1]) is pulsed, or a reading-channel byte while reading_ld_en
  # (uio_in[2]) is pulsed. Same 8 physical pins serve both roles.
  ui_in[0]: "Data byte in, bit 0 (calibration byte or reading channel byte)"
  ui_in[1]: "Data byte in, bit 1 (calibration byte or reading channel byte)"
  ui_in[2]: "Data byte in, bit 2 (calibration byte or reading channel byte)"
  ui_in[3]: "Data byte in, bit 3 (calibration byte or reading channel byte)"
  ui_in[4]: "Data byte in, bit 4 (calibration byte or reading channel byte)"
  ui_in[5]: "Data byte in, bit 5 (calibration byte or reading channel byte)"
  ui_in[6]: "Data byte in, bit 6 (calibration byte or reading channel byte)"
  ui_in[7]: "Data byte in, bit 7 (calibration byte or reading channel byte)"

  uo_out[0]: "calib_done -- high once calibration has finished"
  uo_out[1]: "anomaly_flag -- high if the last reading was flagged anomalous (valid once anomaly_valid has pulsed)"
  uo_out[2]: "anomaly_valid -- one-cycle pulse marking anomaly_flag as freshly updated"
  uo_out[3]: "unused"
  uo_out[4]: "unused"
  uo_out[5]: "unused"
  uo_out[6]: "unused"
  uo_out[7]: "unused"

  uio_in[0]: "calib_start -- pulse once to begin calibration"
  uio_in[1]: "calib_ld_en -- pulse once per calibration byte on ui_in"
  uio_in[2]: "reading_ld_en -- pulse once per reading-channel byte on ui_in"
  uio_in[3]: "unused"
  uio_in[4]: "unused"
  uio_in[5]: "unused"
  uio_in[6]: "unused"
  uio_in[7]: "unused"

  uio_out[0]: "unused (this design never drives uio_out)"
  uio_out[1]: "unused"
  uio_out[2]: "unused"
  uio_out[3]: "unused"
  uio_out[4]: "unused"
  uio_out[5]: "unused"
  uio_out[6]: "unused"
  uio_out[7]: "unused"
