---
project:
  title:        "Sensor Covariance Anomaly Detector"
  author:       "OpenLane Odyssey"
  discord:      "saithescienceguy"
  description:  "Calibrates a per-channel mean and variance profile from an 8-channel sensor's baseline readings, then flags new readings that deviate too far from that profile."
  language:     "Verilog"
  clock_hz:     40000000

  # 1x2: verified via local OpenLane run -- 1x1 fails Global Placement at
  # 186% utilization (std-cell area 24,189 sq um vs a single tile's usable
  # core), 1x2 passes cleanly (DRC/LVS/antenna all pass, zero timing
  # violations) at 87% target density.
  tiles: "1x2"

  top_module:  "tt_um_sensor_monitor"

  source_files:
    - "sensor_monitor.sv"
    - "tt_um_sensor_monitor.sv"

pinout:
  # Inputs -- shared data-byte input: carries a calibration byte while
  # calib_ld_en (uio[1]) is pulsed, or a reading-channel byte while
  # reading_ld_en (uio[2]) is pulsed. Same 8 physical pins serve both roles.
  ui[0]: "Data byte in, bit 0 (calibration byte or reading channel byte)"
  ui[1]: "Data byte in, bit 1 (calibration byte or reading channel byte)"
  ui[2]: "Data byte in, bit 2 (calibration byte or reading channel byte)"
  ui[3]: "Data byte in, bit 3 (calibration byte or reading channel byte)"
  ui[4]: "Data byte in, bit 4 (calibration byte or reading channel byte)"
  ui[5]: "Data byte in, bit 5 (calibration byte or reading channel byte)"
  ui[6]: "Data byte in, bit 6 (calibration byte or reading channel byte)"
  ui[7]: "Data byte in, bit 7 (calibration byte or reading channel byte)"

  # Outputs
  uo[0]: "calib_done -- high once calibration has finished"
  uo[1]: "anomaly_flag -- high if the last reading was flagged anomalous (valid once anomaly_valid has pulsed)"
  uo[2]: "anomaly_valid -- one-cycle pulse marking anomaly_flag as freshly updated"
  uo[3]: ""
  uo[4]: ""
  uo[5]: ""
  uo[6]: ""
  uo[7]: ""

  # Bidirectional pins -- used as inputs only in this design (control strobes)
  uio[0]: "calib_start -- pulse once to begin calibration"
  uio[1]: "calib_ld_en -- pulse once per calibration byte on ui[7:0]"
  uio[2]: "reading_ld_en -- pulse once per reading-channel byte on ui[7:0]"
  uio[3]: ""
  uio[4]: ""
  uio[5]: ""
  uio[6]: ""
  uio[7]: ""

# Do not change!
yaml_version: 6
